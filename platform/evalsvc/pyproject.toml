[project]
name = "agentpave-evalsvc"
version = "0.0.1"
description = "Eval service: golden dataset, deterministic asserts, LLM-as-judge, baselines"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # The judge reaches models only through the gateway (ARCHITECTURE.md
    # invariant 1), so this package depends on the gateway's boundary models —
    # not on boto3's Bedrock client. There is deliberately no `bedrock` dep.
    "agentpave-gateway",
]

[tool.uv.sources]
agentpave-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpave_evalsvc"]
