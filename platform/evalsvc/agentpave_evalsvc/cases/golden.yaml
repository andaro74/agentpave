# The golden dataset: 30 cases over recorded TVMaze fixtures.
#
# Drafted by Claude with the `eval-case-author` skill, then curated by hand.
# The curation rate is recorded in docs/VALIDATION.md — ARCHITECTURE.md §6 asks
# for it to be published, because a dataset nobody edited is a dataset nobody
# checked.
#
# Every expectation here is grounded in a committed fixture. Nothing asserts a
# fact the fixtures do not contain, which is the point: a case that expects
# something only the model's training data knows is testing recall, not
# grounding, and would go green against a hallucination.
#
# `must_not_contain` entries are hallucination bait — plausible facts absent
# from the fixture. The Severance fixture is especially good for this: TVMaze
# records `network: null` and `webChannel: Apple TV`, and a model answering
# from memory reliably reaches for a broadcast network.

cases:
  # ── airing: what network / when does it air ──────────────────────────────
  - case_id: airing-severance-channel
    capability: airing
    grading: judged
    prompt: What channel or network airs Severance?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Apple TV"]
    must_not_contain: ["HBO", "Netflix", "AMC"]

  - case_id: airing-severance-status
    capability: airing
    grading: judged
    # ── half of this question is deliberately unanswerable. Do not "fix" it. ──
    #
    # `shows_44933_episodes.json` is an episode list and carries no status
    # field — that lives in the search fixture. So "is it still running" cannot
    # be grounded here, and it is meant not to be. The grounded answer declines
    # that half and answers the other.
    #
    # Two hand-labelled calibration samples depend on it, and they are the most
    # valuable pair in that file: one passes an answer that says the catalogue
    # cannot tell, and one fails the near-miss that asserts "still running"
    # while getting every other claim right. Rewrite the prompt to be fully
    # groundable and both samples become meaningless — the dataset loses its
    # only measurement of "say you don't know", which is the behaviour hardest
    # to get and easiest to lose.
    #
    # M04's curation pass rewrote it anyway, on the reasoning above, and the
    # loader's calibration cross-reference is what caught it. The comment is
    # here so the next reader does not have to be caught by the same guard.
    prompt: Is Severance still running, and what was its most recent episode?
    fixture: shows_44933_episodes.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Cold Harbor"]
    must_not_contain: ["season 3", "Season 3"]

  - case_id: airing-severance-premiere
    capability: airing
    grading: judged
    prompt: When did Severance premiere?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["2022"]
    # The case had no bait, so it could only fail by the model saying nothing.
    # Neighbouring years are the plausible wrong answers here — the fixture
    # records 2022-02-18 and nothing in it mentions either of these.
    must_not_contain: ["2021", "2023"]

  - case_id: airing-severance-last-airdate
    capability: airing
    grading: judged
    prompt: What date did the latest episode of Severance air?
    fixture: shows_44933_episodes.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    # This assertion is coupled to `SERVE_SYSTEM`'s ISO-date rule, deliberately
    # — the alternative was matching prose date formats with a regex, which is
    # testing wording. The coupling is pinned by a test in
    # `test_evalsvc_harness.py`, so deleting the rule turns `make check` red
    # instead of quietly costing eval points in CI for a formatting reason.
    must_contain: ["2025-03-21"]

  - case_id: airing-schedule-abc-overnight
    capability: airing
    grading: judged
    prompt: Which show airs on ABC in the overnight block on this schedule?
    fixture: schedule__country-us__date-2026-08-07.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    must_contain: ["ABC World News Now"]

  - case_id: airing-schedule-fox-friends-first
    capability: airing
    grading: judged
    prompt: What network airs FOX & Friends First, and at what time?
    fixture: schedule__country-us__date-2026-08-07.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    # `"05:00"` is the fixture's own airtime string, and it rides on the same
    # "exactly as they appear in the data" clause as the ISO dates above. See
    # the note there; the same test pins it.
    must_contain: ["Fox News Channel", "05:00"]

  - case_id: airing-schedule-date
    capability: airing
    grading: judged
    prompt: What date does this US schedule cover?
    fixture: schedule__country-us__date-2026-08-07.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    must_contain: ["2026-08-07"]

  - case_id: airing-missing-show-episodes
    capability: airing
    grading: judged
    # The recorded 404. It sat in the fixtures referenced by no case and no
    # probe from M03 until M05's curation — listed as open in VALIDATION.md,
    # which is a fixture carrying no coverage while looking like it does.
    #
    # `load_fixture` passes only the body, and this body is null, so the model
    # is handed the literal text `null`. There is nothing to be right about;
    # the only grounded answer is that the catalogue lists nothing for this
    # show. That makes it the second of the two "say you don't know" cases,
    # and the only one where the tool succeeded in returning nothing at all
    # rather than returning an empty list.
    #
    # The bait is the other episode fixture's titles: an answer reaching for
    # them is answering from the dataset's neighbours or from memory, and
    # either way not from this response.
    prompt: What episodes does the catalogue list for show 99999999?
    fixture: shows_99999999_episodes.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_not_contain: ["Cold Harbor", "Good News About Hell"]

  - case_id: airing-unknown-show
    capability: airing
    grading: judged
    prompt: What network airs the show zzzz-no-such-show?
    fixture: search_shows__q-zzzz-no-such-show.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    # The grounded answer is "no such show". Naming any network at all is the
    # failure this case exists to catch.
    must_not_contain: ["ABC", "CBS", "NBC", "Apple TV"]

  # ── summarize: two sentences with genres ─────────────────────────────────
  - case_id: summarize-severance-two-sentences
    capability: summarize
    grading: judged
    prompt: Summarize Severance in two sentences, and list its genres.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    # `"Fiction"`, not `"Science-Fiction"`. The fixture hyphenates; English
    # prose usually does not, and this case asks for prose. Asserting the
    # hyphenated form makes the case fail on punctuation when the model writes
    # "science fiction" — a wording test wearing a genre's clothes. The
    # substring matches either spelling, and the fact is what is being graded.
    #
    # The enrichment cases keep the hyphen on purpose: those return the field
    # verbatim in JSON, where the catalogue's own spelling is the right answer.
    must_contain: ["Drama", "Fiction", "Mystery"]

  - case_id: summarize-severance-premise
    capability: summarize
    grading: judged
    prompt: In one sentence, what is the premise of Severance?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    must_contain: ["Lumon"]

  - case_id: summarize-severance-protagonist
    capability: summarize
    grading: judged
    prompt: Who leads the team at the centre of Severance?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Mark"]

  - case_id: summarize-aligned-reverence
    capability: summarize
    grading: judged
    prompt: Summarize Aligned Reverence in two sentences with its genres.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    must_contain: ["Romance"]

  - case_id: summarize-episode-one
    capability: summarize
    grading: judged
    # The question now asks for the title the expectation always demanded. It
    # did not before, and the case passed only because the model volunteered
    # the title while padding its answer; tightening the tone instruction made
    # it terser and the expectation failed. An assertion the question does not
    # ask for is a coin toss, not a test.
    prompt: Summarize the first episode of Severance in one sentence, naming the episode.
    fixture: shows_44933_episodes.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    must_contain: ["Good News About Hell"]

  - case_id: summarize-season-two-finale
    capability: summarize
    grading: judged
    prompt: What is the title of the season 2 finale of Severance, and what number episode is it?
    fixture: shows_44933_episodes.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    # `"10"` was dropped from must_contain for the reason `"one"` was dropped
    # from `running-count-of-running` in M03: a two-character numeral is not an
    # assertion. It matches "2010", "$0.10", "10 episodes" and any sentence
    # that happens to contain the digits — so the case passed whether or not
    # the model read the episode number, which is the thing being asked.
    #
    # The question still asks for the number, and the judge grades completeness
    # against the question. An answer that omits it loses points there, where
    # the loss is visible, rather than here, where it never was.
    must_contain: ["Cold Harbor"]
    must_not_contain: ["season 3", "Season 3"]

  - case_id: summarize-schedule-overview
    capability: summarize
    grading: judged
    prompt: In two sentences, what kind of programming dominates this US schedule?
    fixture: schedule__country-us__date-2026-08-07.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    # The schedule is overwhelmingly cable news. Any answer grounded in the
    # fixture reaches that conclusion; one that does not, was not reading it.
    must_contain: ["news"]

  - case_id: summarize-no-results
    capability: summarize
    grading: judged
    prompt: Summarize the show zzzz-no-such-show in two sentences.
    fixture: search_shows__q-zzzz-no-such-show.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_not_contain: ["Drama", "Comedy"]

  # ── running: which of these are currently running ────────────────────────
  - case_id: running-severance-search-set
    capability: running
    grading: judged
    prompt: Which of these shows are currently running?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    # Of the three search hits only Severance has status "Running"; the other
    # two are "Ended". This is the cleanest running case in the fixtures.
    must_contain: ["Severance"]
    must_not_contain: ["all three", "All three"]

  - case_id: running-aligned-reverence-ended
    capability: running
    grading: judged
    prompt: Has Aligned Reverence ended?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Ended"]

  - case_id: running-la-riviere-esperance
    capability: running
    grading: judged
    prompt: Is La Rivière Espérance still in production?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Ended"]

  - case_id: running-count-of-running
    capability: running
    grading: judged
    prompt: How many of these shows are still running?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    # "one" tested how the model phrased a count, not whether it read the
    # status field — the failing answer was correct and worded differently.
    # The judge grades completeness; this pins the show it must identify.
    must_contain: ["Severance"]
    # ── this case carries no bait, and the attempt to give it some is why ────
    #
    # M05's curation added `must_not_contain: ["two", "three"]`, reasoning that
    # two of the three hits are Ended so any count above one is wrong. The
    # deployed run failed it immediately, on a correct answer: "one of the
    # three shows is still running — the other two have ended."
    #
    # That is the same mistake M03 made here from the other side, when
    # `must_contain: ["one"]` failed an answer that was right and worded
    # differently. A numeral is not a claim. "two" appears in a correct answer
    # as readily as in a wrong count, and no substring can tell "two are
    # running" from "the other two have ended" — that is a semantic property,
    # which is what the judge is for.
    #
    # So the count is graded by the judge on completeness against the question,
    # and this case's deterministic half asserts only the show it must name.

  - case_id: running-severance-status-word
    capability: running
    grading: judged
    prompt: What status does the catalogue record for Severance?
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_contain: ["Running"]
    # The other two shows in this fixture are both "Ended", and reading the
    # status off the wrong record is the mistake this case exists to catch.
    must_not_contain: ["Ended"]

  - case_id: running-empty-set
    capability: running
    grading: judged
    prompt: Which of these shows are currently running?
    fixture: search_shows__q-zzzz-no-such-show.json
    budget: { latency_ms: 15000, cost_usd: 0.01 }
    must_not_contain: ["Severance"]

  # ── enrichment: structured metadata record ───────────────────────────────
  # All deterministic: the schema is asserted, not judged. `must_contain` on a
  # JSON body checks the value landed in the record at all; the schema assert
  # checks its shape and the ≤50-word summary cap.
  - case_id: enrichment-severance
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Severance.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    must_contain: ["Severance", "Apple TV", "Running"]

  - case_id: enrichment-severance-genres
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Severance, including all genres.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    must_contain: ["Drama", "Science-Fiction", "Mystery"]

  - case_id: enrichment-severance-null-runtime
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Severance. The runtime field must reflect the catalogue exactly.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    # This case used to assert `must_contain: ["49"]`, and it was teaching the
    # opposite of `enrichment-null-network` two cases below.
    #
    # TVMaze records `runtime: null` for Severance and `averageRuntime: 49`.
    # The schema has one field, `runtime`. So the only way to satisfy "49" was
    # for the model to substitute a *different* field's value into a null one —
    # the exact move the null-network case exists to catch, rewarded here.
    # A dataset that punishes an invented network and pays for an invented
    # runtime is not testing grounding, it is testing which case ran last.
    #
    # 49 is now the bait, and good bait: the number is right there in the tool
    # response, one field over.
    must_not_contain: ["49"]

  - case_id: enrichment-aligned-reverence
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Aligned Reverence.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    must_contain: ["Aligned Reverence", "Ended"]

  - case_id: enrichment-la-riviere-esperance
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for La Rivière Espérance, including its runtime.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    # The runtime assertion moved here from the Severance case, because this is
    # the show the fixture actually records a runtime for: `runtime: 90`, not
    # null. Same expectation, now grounded in a field that exists.
    must_contain: ["France 2", "90"]

  - case_id: enrichment-null-network
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Severance. The network field must reflect the catalogue exactly.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }
    # TVMaze records network: null for Severance — it carries a webChannel
    # instead. A record that invents a broadcast network here is the exact
    # failure structured output is supposed to make visible.
    must_not_contain: ["NBC", "CBS", "HBO"]

  - case_id: enrichment-summary-cap
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for Severance with a summary of at most 50 words.
    fixture: search_shows__q-severance.json
    budget: { latency_ms: 25000, cost_usd: 0.03 }

  - case_id: enrichment-unknown-show
    capability: enrichment
    grading: deterministic
    prompt: Return the JSON metadata record for zzzz-no-such-show.
    fixture: search_shows__q-zzzz-no-such-show.json
    budget: { latency_ms: 20000, cost_usd: 0.02 }
    # An empty search result still has to produce a well-formed record; the
    # schema assert is what proves the model did not answer with prose.
    must_not_contain: ["Drama", "Running"]
