[project]
name = "agentpave-mcp-tvmaze"
version = "0.0.1"
description = "tvmaze-catalog MCP server: the platform's sample governed tool"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "agentpave-registry",
    # ASGI -> Lambda for the deployed MCP surface.
    "mangum>=0.19",
]

[tool.uv.sources]
agentpave-registry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpave_mcp_tvmaze"]
