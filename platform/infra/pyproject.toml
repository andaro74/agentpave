[project]
name = "agentpave-infra"
version = "0.0.1"
description = "AgentPave CDK app: one stack per component"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
    # The guardrail policy schema lives with the gateway; infra renders it into
    # CloudFormation. The dependency points this way on purpose — the gateway
    # must never import CDK.
    "agentpave-gateway",
]

[tool.uv.sources]
agentpave-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpave_infra"]
