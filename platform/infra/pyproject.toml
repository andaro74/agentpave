[project]
name = "agentpave-infra"
version = "0.0.1"
description = "AgentPave CDK app: one stack per component"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpave_infra"]
