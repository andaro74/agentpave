[project]
name = "agentpave-pave"
version = "0.0.1"
description = "The AgentPave platform CLI: new / eval / shadow-eval"
requires-python = ">=3.12"
dependencies = [
    "agentpave-evalsvc",
    # The scaffolder asks Cedar what a new identity is granted rather than
    # hand-writing an allow-list into the rendered service (ADR-020).
    "agentpave-registry",
    # The scaffolder renders Python and YAML that themselves contain braces,
    # so `str.format`-style substitution is not viable. StrictUndefined is the
    # reason for a real engine rather than regex replacement: a template
    # referencing an unsupplied variable must fail the render, not emit an
    # empty string and scaffold a service with a blank package name.
    "jinja2>=3.1",
]

# The command is `pave`; the module is `agentpave_pave`. They differ on
# purpose. A module literally named `pave` inside a directory literally named
# `pave/` is shadowed by that directory as a namespace package the moment the
# repo root is on `sys.path` — which it is under pytest — and `import pave`
# then resolves to the workspace folder instead of the installed package.
# That is ADR-004's failure in a new costume, so this package follows the same
# convention every other component already does: `agentpave_<component>`.
[project.scripts]
pave = "agentpave_pave.cli:main"

[tool.uv.sources]
agentpave-evalsvc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpave_pave"]
