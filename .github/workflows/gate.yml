# The quality gate. Thin on purpose.
#
# Everything this file decides is declared in `gate.yml` at the repo root and
# executed by `pave gate`, so CI and a laptop run the same ladder. What lives
# here is the plumbing GitHub needs and nothing else: when to run, which
# identity to assume, and where to put the comment.
#
# The one judgement call encoded here is *when* the deployed levels run
# (ADR-028). They cost roughly $0.47 and need AWS, so they run on changes that
# could plausibly move a score — not on a README edit.

name: quality gate

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the top, so a job that needs more has to say so.
permissions:
  contents: read

concurrency:
  # A second push supersedes the first. Two evals racing on one branch is two
  # bills for one answer, and the older one is already stale.
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: L0 hermetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the workflows
        # ROADMAP M05 asks for actionlint in the hermetic gate. It runs here
        # rather than in `make check`, because `make check` must pass on a
        # clean clone with no Go toolchain — ADR-029, which also records that
        # this install is unpinned. The structural assertions in
        # `test_workflows.py` check what actionlint has no opinion about:
        # whether the gate fails closed.
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the CDK CLI
        # `make check` ends in `cdk synth`, which is a Node package. The first
        # CI run failed here with `cdk: command not found` — the gate's own
        # first execution finding that the hermetic gate was never as
        # self-contained as it claimed (ADR-029).
        run: npm install --global aws-cdk@2

      - name: Run the hermetic levels
        run: uv run pave gate --hermetic

  changed:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      graded: ${{ steps.filter.outputs.graded }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff below compares against the base branch, and
          # a shallow clone has no merge base to compare against.
          fetch-depth: 0

      - name: Decide whether anything gradeable changed
        id: filter
        # Written out rather than pulled from a third-party filter action: the
        # decision of when to spend money on an eval is one this repository
        # should be able to read without leaving it.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$base"...HEAD || git ls-files)
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(platform/|pave/|gate\.yml|\.github/workflows/)'; then
            echo "graded=true" >> "$GITHUB_OUTPUT"
          else
            echo "graded=false" >> "$GITHUB_OUTPUT"
            echo "no gradeable paths changed — the deployed levels are skipped (ADR-028)"
          fi

  deployed:
    name: L2 eval + L5 adversarial
    needs: [hermetic, changed]
    if: needs.changed.outputs.graded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC. There is no access key anywhere in this repository (ADR-027).
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Assume the CI role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-west-2

      - name: Run the deployed levels
        id: gate
        # Not `continue-on-error`. The comment is posted either way by the step
        # below, which runs on failure explicitly — a gate that skipped its own
        # explanation when it blocked would be at its least useful exactly when
        # someone needs it most.
        run: uv run pave gate --aws

      - name: Post the scorecard
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agentpave-eval-gate -->';
            let body;
            try {
              body = fs.readFileSync('gate-comment.md', 'utf8');
            } catch {
              // The eval never got far enough to write one. Say so, rather
              // than leaving the pull request with a red check and silence.
              body = `${marker}\n## ❌ Quality gate — the eval did not complete\n\n` +
                `No scorecard was written. See the run log for why.`;
            }
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = comments.data.find((c) => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  # The one check branch protection requires (ADR-034).
  #
  # `deployed` cannot be the required check, because it is conditional: on a
  # docs-only pull request it never runs, and GitHub treats a required check that
  # never runs as permanently pending. Requiring it would deadlock every
  # documentation change, including the ones that close a milestone.
  #
  # The tempting fix is to make `deployed` always run and exit green when nothing
  # gradeable changed. That is worse than the deadlock: it produces a **green
  # `L2 eval + L5 adversarial`** having evaluated nothing, and a required check is
  # read as a verdict. This repository has shipped that shape four times already —
  # M02's transport failures folded into passing results, M04's `traced` act
  # vouching for Lambda's own segments, ADR-015's probe that could never pass, and
  # the first PII assertion that read the same YAML on both sides. A fifth, in the
  # milestone whose thesis is that gates fail closed, is not a trade worth making.
  #
  # So the skip stays a visible skip and this job carries the verdict. It states
  # the whole truth table explicitly, and `test_workflows.py` asserts each branch
  # of it — which is the other reason it exists: an `if` buried in a shell step is
  # not something the hermetic gate can check.
  verdict:
    name: gate verdict
    needs: [hermetic, changed, deployed]
    # Always, or a skipped `deployed` would skip this too and reintroduce the
    # pending-forever deadlock one level up.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          HERMETIC: ${{ needs.hermetic.result }}
          CHANGED: ${{ needs.changed.result }}
          DEPLOYED: ${{ needs.deployed.result }}
          GRADED: ${{ needs.changed.outputs.graded }}
        run: |
          set -euo pipefail
          echo "hermetic=$HERMETIC changed=$CHANGED deployed=$DEPLOYED graded=$GRADED"

          # Fail closed on anything that is not an outright success, which
          # includes `cancelled`. A superseded run must not bank a pass — the
          # concurrency group above cancels the older run on a second push, and
          # its checks belong to the commit it was testing.
          [ "$HERMETIC" = "success" ] || { echo "L0 did not pass"; exit 1; }
          [ "$CHANGED" = "success" ] || { echo "the path filter did not run"; exit 1; }

          if [ "$GRADED" = "true" ]; then
            [ "$DEPLOYED" = "success" ] || { echo "L2/L5 did not pass"; exit 1; }
            echo "✅ every level passed"
          else
            # `skipped` and nothing else. If the deployed job ran at all when the
            # filter said nothing gradeable changed, the two disagree about what
            # this run did, and a verdict is the wrong place to guess.
            [ "$DEPLOYED" = "skipped" ] || {
              echo "the filter said nothing gradeable changed but L2/L5 is '$DEPLOYED'"; exit 1; }
            echo "✅ L0 passed; no gradeable paths changed, so L2/L5 was skipped (ADR-028)"
          fi
